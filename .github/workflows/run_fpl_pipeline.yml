# This name will be displayed in the GitHub Actions UI
name: FPL Data Pipeline

# Triggers for the workflow
on:
  # Run this workflow automatically on a schedule (hourly)
  schedule:
    - cron: '0 * * * *' # You can customize this. See https://crontab.guru/

  # This line is ESSENTIAL for the "Run workflow" button to appear
  workflow_dispatch:
    inputs:
      force:
        description: "Force-regenerate the snapshot even if no new gameweek is final"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' # Match your development version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run FPL Data Pipeline
        # The GCP_CREDENTIALS secret is read from GitHub Settings
        run: python3 data_pipeline.py
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}

      - name: Build dashboard snapshot (gated)
        run: python3 build_snapshot.py
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          FORCE_REBUILD: ${{ github.event.inputs.force }}

      - name: Commit snapshot if changed
        run: |
          if ! git diff --quiet -- data/dashboard.json; then
            git config user.name "fpl-bot"
            git config user.email "fpl-bot@users.noreply.github.com"
            git add data/dashboard.json
            git commit -m "data: update dashboard snapshot [skip ci]"
            git push
          else
            echo "No snapshot change — nothing to commit."
          fi